name: Infra

on:
  pull_request:
    branches: [main]
    paths: ["infra/**", ".github/workflows/infra.yml"]
  push:
    branches: [main]
    paths: ["infra/**", ".github/workflows/infra.yml"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: infra-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: false

env:
  TF_VERSION: "1.17.2"
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  AWS_REGION: ap-northeast-2

jobs:
  check:
    name: Terraform check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e  # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - name: Format
        run: terraform fmt -check -recursive -diff infra
      - name: Validate
        run: |
          for dir in infra/bootstrap infra/stacks/*/; do
            terraform -chdir="$dir" init -backend=false -lockfile=readonly
            terraform -chdir="$dir" validate
          done
      - name: checkov
        uses: bridgecrewio/checkov-action@b17b606d6ec72bb8ba5721ad5b7e340b80a9fc39  # v12.3142.0
        with:
          directory: infra
          config_file: infra/.checkov.yaml

  plan:
    name: Plan (${{ matrix.stack }})
    needs: check
    if: >-
      vars.AWS_BOOTSTRAPPED == 'true' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    strategy:
      matrix:
        stack: [baseline]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd  # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_PLAN_ROLE_ARN }}
          role-session-name: gh-plan-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e  # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - name: Plan
        working-directory: infra/stacks/${{ matrix.stack }}
        env:
          STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
        run: |
          terraform init -lockfile=readonly -backend-config="bucket=${STATE_BUCKET}" > /dev/null
          terraform plan -lock-timeout=60s -out=tfplan > /dev/null
          {
            echo "### ${{ matrix.stack }}"
            terraform show -json tfplan | jq -r '
              [.resource_changes[]? | select(.change.actions != ["no-op"])
               | "- `\(.change.actions | join("/"))` \(.address)"]
              | if length == 0 then "- 변경 없음" else .[] end'
          } >> "$GITHUB_STEP_SUMMARY"
          rm -f tfplan

  apply:
    name: Apply (${{ matrix.stack }})
    needs: plan
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: aws
    permissions:
      contents: read
      id-token: write
    strategy:
      max-parallel: 1
      matrix:
        stack: [baseline]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd  # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_APPLY_ROLE_ARN }}
          role-session-name: gh-apply-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e  # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - name: Apply
        working-directory: infra/stacks/${{ matrix.stack }}
        env:
          STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
        run: |
          terraform init -lockfile=readonly -backend-config="bucket=${STATE_BUCKET}" > /dev/null
          terraform plan -lock-timeout=60s -out=tfplan > /dev/null
          terraform apply -compact-warnings tfplan > /dev/null
          rm -f tfplan
          echo "### ${{ matrix.stack }} 적용 완료" >> "$GITHUB_STEP_SUMMARY"
