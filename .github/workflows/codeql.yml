name: Security Scan

# 코드가 바뀔 때와 매주 한 번:
# - CodeQL: Python/JavaScript/워크플로 코드의 취약점(XSS, 인젝션, SSRF 등) 정적 분석
# - pip-audit: 사용 중인 파이썬 라이브러리의 알려진 취약점(CVE) 검사
on:
  push:
    branches: [main]
    paths: ["**.py", "**.js", "**.html", ".github/workflows/**", "requirements.txt"]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 18 * * 0"   # 매주 월요일 03:00 KST
  workflow_dispatch:

permissions: {}

jobs:
  codeql:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write   # 결과를 Security 탭에 올리기 위한 권한
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@f3bbb05694c2f74569081c28664c0866d64dec21  # v4.39.3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
      - uses: github/codeql-action/analyze@f3bbb05694c2f74569081c28664c0866d64dec21  # v4.39.3
        with:
          category: "/language:${{ matrix.language }}"

  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - name: pip-audit (알려진 취약 라이브러리 검사)
        run: |
          pip install pip-audit==2.10.1
          pip-audit -r requirements.txt --strict
