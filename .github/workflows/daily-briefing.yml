name: Daily Security Briefing

on:
  schedule:
    - cron: "47 23 * * *"
    - cron: "17 0 * * *"
    - cron: "47 0 * * *"
    - cron: "40 1 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "오늘 글이 있어도 다시 생성"
        type: boolean
        default: false

permissions: {}

concurrency:
  group: daily-briefing
  cancel-in-progress: false

jobs:
  briefing:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install --require-hashes -r requirements.txt

      - name: Security tests
        run: python -m unittest discover tests

      - name: Generate briefing
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
          FORCE: ${{ inputs.force }}
        run: |
          if [ "$FORCE" = "true" ]; then
            python -m briefing daily --force
          else
            python -m briefing daily
          fi

      - name: Commit & push
        run: |
          git config user.name "security-briefing-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _posts _data state
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "📰 $(TZ=Asia/Seoul date +%F) 보안 이슈 브리핑"
            git push
          fi

      - name: Notify Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python -m briefing notify

      - name: Notify failure
        if: failure()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python -m briefing notify --failed
