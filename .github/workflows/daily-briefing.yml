name: Daily Security Briefing

on:
  schedule:
    - cron: "0 0 * * *"   # 매일 00:00 UTC = 오전 9시 KST
  workflow_dispatch:       # Actions 탭에서 수동 실행 (테스트용)

# 최소 권한 원칙 (OWASP A01/A08): 기본은 권한 없음, 필요한 job 에만 부여
permissions: {}

concurrency:
  group: daily-briefing
  cancel-in-progress: false

jobs:
  briefing:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write     # 브리핑 글 커밋용 (이 외 권한 없음)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1 (태그 대신 커밋 SHA로 고정: 공급망 공격 방지)

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Security tests
        run: python -m unittest discover tests

      - name: Generate briefing
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}   # 선택 사항: 비우면 자동 선택
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}  # 선택 사항: 없어도 동작 (있으면 NVD 호출 한도 증가)
        run: python -m briefing daily

      - name: Commit & push
        run: |
          git config user.name "security-briefing-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _posts _data data
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "📰 $(TZ=Asia/Seoul date +%F) 보안 이슈 브리핑"
            git push
          fi

      - name: Notify Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python -m briefing notify

      - name: Notify failure
        if: failure()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python -m briefing notify --failed
