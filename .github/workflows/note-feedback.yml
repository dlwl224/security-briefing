name: Analysis Note Feedback

# 분석 노트(_data/comments/*.yml)를 사람이 커밋하면 AI 코칭을 디스코드로 보낸다.
# (봇이 매일 만드는 빈 양식은 GITHUB_TOKEN 으로 push 되므로 이 워크플로를 실행시키지 않는다)
on:
  push:
    branches: [main]
    paths: ["_data/comments/**"]

permissions: {}

concurrency:
  group: note-feedback
  cancel-in-progress: false

jobs:
  feedback:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read          # 읽기만 (사이트·저장소를 바꾸지 않음)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Send feedback
        env:
          # 커밋 값은 환경변수로 넘긴다 (run 스크립트에 직접 넣지 않음 → 표현식 주입 방지)
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_FEEDBACK_WEBHOOK_URL: ${{ secrets.DISCORD_FEEDBACK_WEBHOOK_URL }}   # 선택: 피드백 전용 채널
        run: python feedback.py
