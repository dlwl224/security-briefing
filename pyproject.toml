# 코드 규칙 설정 — 자세한 설명은 docs/CONVENTIONS.md
[project]
name = "security-briefing"
version = "1.0.0"
description = "매일 국내·해외 보안 이슈를 수집·검증·요약해 GitHub Pages 에 게시하는 자동화"
requires-python = ">=3.12"

[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = ["_site", ".jekyll-cache"]

[tool.ruff.format]
quote-style = "double"
line-ending = "lf"

[tool.ruff.lint]
select = [
  "E", "W",   # PEP 8 기본 스타일
  "F",        # 미사용 import·변수 등 오류 가능성
  "I",        # import 정렬
  "N",        # 이름 규칙 (snake_case 함수, PascalCase 클래스, UPPER_CASE 상수)
  "UP",       # 최신 파이썬 문법
  "B",        # 흔한 버그 패턴
  "S",        # 보안 (bandit): 하드코딩 비밀값, 셸 실행, 안전하지 않은 역직렬화, 타임아웃 없는 요청 등
  "SIM",      # 불필요하게 복잡한 코드
  "C4",       # 컴프리헨션 정리
  "RUF",      # ruff 전용 규칙
]
ignore = [
  "RUF001", "RUF002", "RUF003",  # 한국어 문서·문자열의 가운뎃점(·) 등을 '헷갈리는 문자'로 보는 규칙
  "E501",                        # 줄 길이는 formatter 에 맡김
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S104", "S105", "S106", "E402", "E731", "E741", "N802", "N806", "SIM117"]   # 테스트: 가짜 값·짧은 헬퍼·unittest 식 이름 허용

[tool.ruff.lint.isort]
known-first-party = ["briefing"]
