[project]
name = "security-briefing"
version = "1.0.0"
description = "매일 국내·해외 보안 이슈를 수집·검증·요약해 GitHub Pages 에 게시하는 자동화"
requires-python = ">=3.12"

[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = ["_site", ".jekyll-cache"]

[tool.ruff.format]
quote-style = "double"
line-ending = "lf"

[tool.ruff.lint]
select = [
  "E", "W",
  "F",
  "I",
  "N",
  "UP",
  "B",
  "S",
  "SIM",
  "C4",
  "RUF",
]
ignore = [
  "RUF001", "RUF002", "RUF003",
  "E501",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S104", "S105", "S106", "E402", "E731", "E741", "N802", "N806", "SIM117"]

[tool.ruff.lint.isort]
known-first-party = ["briefing"]
