# 지표 설명 — 브리핑 글의 ⓘ 툴팁과 About 페이지 '지표 읽는 법'에서 함께 사용 (사람이 관리하는 고정 문구)
cve:
  title: CVE
  sub: Common Vulnerabilities and Exposures
  body: 공개된 보안 취약점마다 붙는 전 세계 공통 고유 번호입니다. 'CVE-연도-일련번호' 형식이며, 같은 취약점을 누구나 같은 이름으로 부를 수 있게 해 줍니다. 이 블로그는 AI가 고른 번호를 미국 NVD에서 실제로 조회해 검증합니다.
cvss:
  title: CVSS
  sub: Common Vulnerability Scoring System
  body: 취약점이 얼마나 심각한지를 0.0~10.0점으로 매긴 국제 표준 점수입니다. 공격이 얼마나 쉬운지(원격 가능 여부, 인증 필요 여부)와 성공했을 때 피해(정보 유출·변조·마비)를 계산합니다. 0.1~3.9 낮음 · 4.0~6.9 중간 · 7.0~8.9 높음 · 9.0~10.0 치명적. 점수는 '얼마나 위험할 수 있나'이지 '지금 공격받고 있나'는 아닙니다.
epss:
  title: EPSS
  sub: Exploit Prediction Scoring System
  body: 앞으로 30일 안에 이 취약점이 실제 공격에 쓰일 확률을 FIRST가 매일 계산해 공개하는 값입니다. CVSS가 '피해의 크기'라면 EPSS는 '공격받을 가능성'입니다. 백분위는 전체 CVE 중 이 취약점보다 확률이 낮은 비율입니다.
kev:
  title: KEV
  sub: CISA Known Exploited Vulnerabilities
  body: 미국 사이버보안·인프라보안국(CISA)이 '실제로 악용되고 있다'고 확인한 취약점 목록입니다. 여기에 오르면 미국 연방기관은 정해진 기한 안에 반드시 패치해야 합니다. 점수와 상관없이 가장 먼저 조치해야 할 신호로 봅니다.
severity:
  title: 위험도 (AI 평가)
  sub: 이 블로그의 자체 지표 · 1~5
  body: 공식 지표가 아니라, AI가 기사 내용을 아래 기준으로 판단한 값입니다. 5 실제 악용·대규모 피해·국가 핵심 인프라 / 4 고위험 취약점·수십만 명 이상 피해 / 3 특정 조직 피해·중요 패치 / 2 제한적 영향 / 1 정책·동향 참고. 취약점의 공식 심각도는 CVSS를 보세요.
threat:
  title: 오늘의 위협 수준 (AI 평가)
  sub: 그날 5건 위험도의 평균
  body: 그날 선정된 이슈들의 'AI 평가 위험도'를 평균 낸 값입니다. 공식 경보 단계가 아니며, 하루의 분위기를 한눈에 보기 위한 참고 지표입니다.
vector:
  title: CVSS 벡터
  sub: 점수가 어떻게 계산됐는지 보여주는 설계도
  body: CVSS 점수는 공격 경로(원격/로컬), 공격 난이도, 필요한 권한, 사용자 행동 필요 여부, 영향 범위, 그리고 정보 유출·변조·마비 정도를 조합해 계산합니다. 빨간 칩은 공격자에게 유리한 조건, 회색 칩은 공격을 어렵게 하는 조건입니다. 같은 점수라도 '로그인 불필요·원격 공격 가능'이면 더 서둘러야 합니다.
priority:
  title: 조치 우선순위 (규칙 기반)
  sub: CISA KEV · FIRST EPSS · CVSS 조합 — AI 판단 아님
  body: P1 즉시(72시간 내) — KEV 등재(실제 악용 확인) 또는 EPSS 10% 이상. P2 우선(2주 내) — CVSS 7.0 이상 또는 EPSS 1% 이상. P3 정기 — 그 외. '점수가 높은가'보다 '실제로 공격받고 있는가'를 먼저 보는 방식으로, CISA의 KEV 우선 조치 원칙과 EPSS 활용 권고를 단순화한 이 블로그의 기준입니다. 고객사 환경(자산 노출 여부, 대체 통제)에 따라 조정해야 합니다.
isms:
  title: ISMS-P 인증기준
  sub: 정보보호 및 개인정보보호 관리체계 인증 (KISA)
  body: 국내 기업이 정보보호 체계를 갖췄는지 인증받는 기준입니다. 이 이슈를 예방·대응하려면 어떤 통제 항목이 제대로 운영돼야 하는지 AI가 제안한 것으로, 허용된 항목 번호만 표시합니다. 실제 심사·컨설팅에서는 원문 기준과 대조해 검토해야 합니다.
attack:
  title: MITRE ATT&CK
  sub: 실제 공격자 행동을 정리한 전 세계 공통 분류
  body: 공격자가 '어떻게' 침투하고 움직였는지를 기법 ID로 분류한 지식 베이스입니다. 탐지 규칙 작성, 모의 훈련 시나리오, 보안 장비 점검의 공통 언어로 쓰입니다. 기사에 드러난 행동을 바탕으로 AI가 제안했으며, 허용 목록 안의 ID만 표시합니다.
cwe:
  title: CWE
  sub: Common Weakness Enumeration
  body: 취약점이 '어떤 종류의 코딩·설계 실수'에서 생겼는지 분류한 번호입니다(예 CWE-79 XSS, CWE-89 SQL 인젝션, CWE-502 역직렬화). NVD가 공식 분류한 값을 그대로 표시하며, 개발 보안 교육이나 시큐어 코딩 점검 항목과 연결할 때 씁니다.
