#   ③ 얼마나 급한가? (가능성·영향)       KEV·EPSS·CVSS + 업무가 멈추나/정보가 새나
#   ④ 그래서 무엇을 하나? (대응 권고)     감소·회피·전가·수용 중 무엇을, 언제까지
