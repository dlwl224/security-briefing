#
# ▶ 이렇게 쓰면 좋아요
#   ✅ "~일 것 같다. 왜냐하면 ~"  (추측과 근거를 나눠서)
#   ❌ AI 요약 다시 쓰기 / "매우 위험하다" 같은 일반론 / 확인 안 된 단정
#
# ▶ 예시 (①~④를 한 문장씩)
